name = "shopify-oauth-worker"
main = "src/index.ts"
compatibility_date = "2023-07-24"
account_id = "" # You should replace this with your Cloudflare account ID

kv_namespaces = [
  { binding = "KV", id = "your_kv_namespace_id" } # You should replace this with your KV namespace ID
]

[vars]
SHOPIFY_API_KEY = "your_shopify_api_key"
SHOPIFY_API_SECRET = "your_shopify_api_secret"
SCOPES = "read_products,write_products"
FORWARDING_ADDRESS = "https://your_app_url"
